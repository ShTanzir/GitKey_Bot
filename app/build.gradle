plugins {
    id 'com.android.application'
}

android {
    namespace 'com.modmase.dialog'
    compileSdk 35

    defaultConfig {
        applicationId 'com.modmase.dialog'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0'
        multiDexEnabled false
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Intentionally dependency-free: keeps the final APK tiny and prevents
// unnecessary secondary DEX files.
